<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090b10" />
      <stop offset="50%" stop-color="#131728" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />
  
  <!-- Outer Antigravity Orbital Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(99,102,241,0.25)" stroke-width="6" stroke-dasharray="16 12" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="rgba(56,189,248,0.3)" stroke-width="4" stroke-dasharray="8 8" />

  <!-- Center Floating Gem / Diamond Icon with glow -->
  <g filter="url(#glow)">
    <!-- Levitation / Antigravity Upward Chevron & Core -->
    <path d="M256 96 L350 240 L256 200 L162 240 Z" fill="url(#glowGrad)" />
    <path d="M256 220 L360 376 L256 320 L152 376 Z" fill="url(#glowGrad)" opacity="0.85" />
    <!-- Pulse Center Core Dot -->
    <circle cx="256" cy="256" r="28" fill="#ffffff" opacity="0.95" />
  </g>
</svg>
